
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Товар — NOIR</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container header-inner">

            <a href="index.html" class="logo">NOIR<span>.</span></a>

            <nav class="navigation">
                <a href="index.html">Главная</a>
                <a href="index.html#catalog">Каталог</a>
                <a href="index.html#about">О бренде</a>
            </nav>

            <a href="index.html#catalog" class="header-button">
                ВЕРНУТЬСЯ В МАГАЗИН
            </a>

        </div>
    </header>

    <main class="product-page">

        <div class="container">

            <a href="index.html#catalog" class="back-link">
                ← НАЗАД К КОЛЛЕКЦИИ
            </a>

            <div class="product-detail">

                <div class="product-detail-image">
                    <img id="productImage" src="" alt="Товар NOIR">
                </div>

                <div class="product-detail-info">

                    <span class="section-label">NOIR / COLLECTION 2026</span>

                    <h1 id="productName">Загрузка...</h1>

                    <p class="product-detail-category" id="productCategory"></p>

                    <div class="product-detail-price" id="productPrice"></div>

                    <p class="product-detail-description">
                        Современный минимализм, продуманный силуэт
                        и комфорт на каждый день.
                        Создано для тех, кто выбирает собственный стиль.
                    </p>
                    <div class="size-selector">
    <span class="size-title">ВЫБЕРИ РАЗМЕР</span>

    <div class="size-options">
        <button class="size-option" data-size="XS">XS</button>
        <button class="size-option" data-size="S">S</button>
        <button class="size-option" data-size="M">M</button>
        <button class="size-option" data-size="L">L</button>
        <button class="size-option" data-size="XL">XL</button>
    </div>
</div>

                    <button class="detail-add-button" id="detailAddButton">
                        ДОБАВИТЬ В КОРЗИНУ
                    </button>

                </div>

            </div>

        </div>

    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <a href="index.html" class="logo">NOIR<span>.</span></a>
            <p>© 2026 NOIR FASHION STORE</p>
        </div>
    </footer>

    <script src="product-page.js"></script>

</body>
</html>
